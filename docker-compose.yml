services:
  database:
    image: mysql:8.4
    container_name: ai-issue-analyzer-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ai_issue_analyzer
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - issue_analyzer_data:/var/lib/mysql

volumes:
  issue_analyzer_data:
